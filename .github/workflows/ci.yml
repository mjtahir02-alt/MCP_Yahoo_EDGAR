name: MCP CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund > npm-install.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 80 npm-install.log
          else
            cat npm-install.log
          fi
          exit "$status"

      - name: Upload installation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-diagnostics
          path: |
            npm-install.log
            mcp-source.tgz
          if-no-files-found: ignore
          retention-days: 1

      - name: Build MCP server
        run: npm run build
